name: CI

on:
  push:
    branches: [main, master, test/**]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    # Public client placeholders only (ADR 0002). Not production secrets.
    # Required so Vitest/Vite can import the Supabase client after `.env`
    # is no longer tracked in git.
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-ci-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify benchmarks
        run: npm run verify:benchmarks

      - name: Test
        run: npm run test:run

      - name: Remove stale entitlement test container
        run: docker rm -f settlerate-entitlement-test 2>/dev/null || true

      - name: Entitlement SQL authority tests
        run: npm run test:entitlement-sql

      - name: Cleanup entitlement test container
        if: always()
        run: docker rm -f settlerate-entitlement-test 2>/dev/null || true

      - name: Build
        # Sentry source-map upload (Phase 8.1 Epic 3 / ADR 0003 §7). These
        # secrets are scoped to this step only — no other step in this job
        # receives them. GitHub Actions does not pass repository secrets to
        # `pull_request` workflow runs triggered from forks, so these
        # resolve to empty strings there; `vite.config.ts` already treats a
        # missing/empty SENTRY_AUTH_TOKEN/SENTRY_ORG/SENTRY_PROJECT as
        # "upload disabled" and builds unchanged in that case. Never
        # printed: `npm run build` does not echo env values, and the Sentry
        # Vite plugin's errorHandler (vite.config.ts) suppresses the raw
        # upload error on failure so credentials cannot appear in CI logs.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: npm run build
