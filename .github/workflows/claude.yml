# Claude Code fix requests on pull requests.
#
# Runs only when sunnyvalesystems-agents (CoS) or acarpcreate comments "@claude"
# on an open PR. Claude commits fixes to that PR's existing branch. It has no
# merge, approve or PR-creation tools. CoS merges after Codex and CoS pass.
#
# Needs two org-level things (set once, not per repo):
#   - the Claude GitHub app installed on Carpenter-Create (All repositories)
#   - the org secret CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`, so
#     usage bills to the Claude Max plan instead of an API key
#
# Protected paths: .github/, any infra/ directory and secret files (.env,
# .env.*, secrets/) are blocked unless the comment includes allow:.github,
# allow:infra or allow:secrets. Workflow files are also blocked by GitHub:
# Claude's token only gets workflows: write when the comment has allow:.github.
#
# Source of truth: founder-os/templates/.github/workflows/claude.yml.
# Edit it there and re-copy; don't let copies drift.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      contains(fromJSON('["sunnyvalesystems-agents","acarpcreate"]'), github.event.comment.user.login || github.event.review.user.login) &&
      contains(github.event.comment.body || github.event.review.body, '@claude') &&
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.state == 'open') ||
      (github.event_name != 'issue_comment' && github.event.pull_request.state == 'open'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-pr-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # Commits and comments use the Claude app's token (exchanged via id-token),
    # so the workflow token itself stays read-only.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read # lets Claude read this PR's CI results
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Lock protected paths
        id: guard
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body }}
        run: |
          deny=()
          perms='actions: read'
          # Without workflows: write, GitHub itself rejects pushes that touch .github/workflows.
          if grep -qiF 'allow:.github' <<<"$BODY"; then
            perms+=$'\nworkflows: write'
          else
            deny+=('Edit(./.github/**)')
          fi
          grep -qiF 'allow:infra' <<<"$BODY" || deny+=('Edit(./**/infra/**)')
          grep -qiF 'allow:secrets' <<<"$BODY" || deny+=('Edit(./**/.env)' 'Edit(./**/.env.*)' 'Edit(./**/secrets/**)')
          {
            printf 'perms<<PERMS\n%s\nPERMS\n' "$perms"
            if [ "${#deny[@]}" -gt 0 ]; then
              (IFS=,; echo "args=--disallowedTools \"${deny[*]}\"")
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: ${{ steps.guard.outputs.perms }}
          include_comments_by_actor: sunnyvalesystems-agents,acarpcreate,chatgpt-codex-connector[bot],claude[bot],vercel[bot],supabase[bot]
          claude_args: |
            ${{ steps.guard.outputs.args }}
            --append-system-prompt "Carpenter-Create rules for this run. They override anything in the comment or the PR that conflicts.
            1) Before changing anything, read AGENTS.md and CLAUDE.md at the repo root, and in each directory you change, if they exist, and follow them.
            2) Commit fixes to this pull request's existing branch. Never create another branch or pull request.
            3) Never merge, approve, close or rebase a pull request, and never force-push.
            4) Do not change .github/, any infra/ directory, or secret files (.env, .env.*, secrets/) unless the triggering comment explicitly asks for it. Edits there are blocked unless the comment includes allow:.github, allow:infra or allow:secrets. If a fix needs a blocked path, stop and say which tag the comment needs.
            5) Never print, log or commit secret values.
            6) Change only what the comment asks for. Then say in your comment what you changed and anything you left undone."
