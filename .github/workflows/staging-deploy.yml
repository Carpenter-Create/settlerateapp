name: Staging Deploy

# Automated staging promotion for a pinned SHA (ADR 0014).
# Runs after CI succeeds on main (not in parallel with validate).
# SPA authority remains Vercel Git → settlerate-app-staging (no Actions SPA deploy).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Commit SHA on main that already passed CI (default: workflow SHA)"
        required: false
        type: string

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write
  actions: read
  checks: read

jobs:
  staging:
    name: Deploy staging (migrate → edge → verify)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    # Intentionally NO SUPABASE_ACCESS_TOKEN at job level — only on mutate steps
    # after checkout (limits exfil via npm lifecycle / optional local tests).
    env:
      STAGING_APP_ORIGIN: https://settlerate-app-staging.vercel.app
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-ci-only
    steps:
      - name: Pin deploy SHA
        id: pin
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ inputs.git_sha }}"
            if [ -z "$SHA" ]; then SHA="${{ github.sha }}"; fi
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          if [ -z "$SHA" ]; then
            echo "REFUSE: empty deploy SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_GIT_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Checkout pinned SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.sha }}
          fetch-depth: 0

      - name: Refuse SHA not on main
        # Use compare API (not shallow fetch + merge-base): depth=1 fetch cannot
        # prove ancestry for older main commits.
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.DEPLOY_GIT_SHA;
            const cmp = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `main...${sha}`,
            });
            // SHA is on main iff it introduces no commits ahead of main.
            if ((cmp.data.ahead_by || 0) > 0) {
              core.setFailed(
                `REFUSE: ${sha} is not contained in main (ahead_by=${cmp.data.ahead_by})`
              );
            }

      - name: Refuse SHA without successful CI validate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.DEPLOY_GIT_SHA;
            const runs = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100,
            });
            const validate = runs.data.check_runs.find(
              (r) => r.name === 'validate' && r.status === 'completed'
            );
            if (!validate || validate.conclusion !== 'success') {
              core.setFailed(
                `REFUSE: no successful CI validate check for ${sha}`
              );
            }

      - name: Record provenance
        run: |
          echo "deploy_git_sha=${DEPLOY_GIT_SHA}"
          echo "github_sha=${GITHUB_SHA}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "environment=staging"
          echo "supabase_ref=gkhbalfpxjtleypbabjo"
          echo "production_ref_forbidden=vpcxzbaxhpucvevnkalo"
          echo "trigger=${{ github.event_name }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci runs WITHOUT deploy secrets (CI already ran test:deploy via vitest).
      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Refuse empty staging credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN missing on GitHub Environment 'staging'" >&2
            exit 1
          fi

      - name: Apply staging migrations (if pending)
        id: migrate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/deploy/applyStagingMigrations.sh

      - name: Deploy staging Edge Functions
        id: edge
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/deploy/deployStagingFunctions.sh

      - name: Verify staging deploy
        id: verify
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy/verifyStagingDeploy.mjs --out staging-verify.json

      - name: Publish staging-verified commit status
        id: status_ok
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.DEPLOY_GIT_SHA;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'staging-verified',
              description: `Staging verified for ${sha.slice(0, 7)}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish staging-verified failure status
        # Only when migrate/edge/verify failed — not when later artifact upload fails
        # after a successful verification (would incorrectly block promotion).
        if: ${{ always() && (steps.migrate.outcome == 'failure' || steps.edge.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.DEPLOY_GIT_SHA;
            if (!sha) return;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'failure',
              context: 'staging-verified',
              description: `Staging verification failed for ${sha.slice(0, 7)}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Upload provenance artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-${{ steps.pin.outputs.sha }}
          path: |
            staging-migration-ledger.json
            staging-verify.json
          if-no-files-found: warn
