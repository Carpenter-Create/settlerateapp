name: Staging Deploy

# Automated staging promotion for a pinned SHA (ADR 0014).
# Runs after CI succeeds on main (not in parallel with validate).
# SPA authority remains Vercel Git → settlerate-app-staging (no Actions SPA deploy).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Optional commit SHA to deploy (default: workflow SHA)"
        required: false
        type: string

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  staging:
    name: Deploy staging (migrate → edge → verify)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_APP_ORIGIN: https://settlerate-app-staging.vercel.app
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: public-anon-key-for-ci-only
    steps:
      - name: Pin deploy SHA
        id: pin
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ inputs.git_sha }}"
            if [ -z "$SHA" ]; then SHA="${{ github.sha }}"; fi
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          if [ -z "$SHA" ]; then
            echo "REFUSE: empty deploy SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_GIT_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Refuse empty staging credentials
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN missing on GitHub Environment 'staging'" >&2
            exit 1
          fi

      - name: Checkout pinned SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.sha }}

      - name: Record provenance
        run: |
          echo "deploy_git_sha=${DEPLOY_GIT_SHA}"
          echo "github_sha=${GITHUB_SHA}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "environment=staging"
          echo "supabase_ref=gkhbalfpxjtleypbabjo"
          echo "production_ref_forbidden=vpcxzbaxhpucvevnkalo"
          echo "trigger=${{ github.event_name }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Deploy unit tests (fail-closed guards)
        run: npm run test:deploy

      - name: Apply staging migrations (if pending)
        run: bash scripts/deploy/applyStagingMigrations.sh

      - name: Deploy staging Edge Functions
        run: bash scripts/deploy/deployStagingFunctions.sh

      - name: Verify staging deploy
        run: node scripts/deploy/verifyStagingDeploy.mjs --out staging-verify.json

      - name: Upload provenance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-${{ steps.pin.outputs.sha }}
          path: |
            staging-migration-ledger.json
            staging-verify.json
          if-no-files-found: warn

      - name: Publish staging-verified commit status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.DEPLOY_GIT_SHA;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'staging-verified',
              description: `Staging verified for ${sha.slice(0, 7)}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish staging-verified failure status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.DEPLOY_GIT_SHA;
            if (!sha) return;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'failure',
              context: 'staging-verified',
              description: `Staging verification failed for ${sha.slice(0, 7)}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
